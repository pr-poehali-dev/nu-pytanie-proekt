<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F4E4C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#1A1A1A"/>
  
  <!-- Outer circle -->
  <ellipse cx="256" cy="230" rx="180" ry="120" 
           fill="none" stroke="url(#goldGradient)" stroke-width="3"/>
  
  <!-- Inner circle -->
  <ellipse cx="256" cy="230" rx="165" ry="107" 
           fill="none" stroke="url(#goldGradient)" stroke-width="2"/>
  
  <!-- Letter M - elegant script style -->
  <path d="M 180 180 Q 190 220 200 260 Q 210 240 220 220 Q 230 200 240 240 Q 250 280 256 260 
           Q 262 240 272 240 Q 282 240 292 260 Q 302 280 312 240 Q 322 200 332 220 
           Q 342 240 352 260 Q 362 220 372 180" 
        fill="none" stroke="url(#goldGradient)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Better M design -->
  <path d="M 170 250 L 170 190 Q 180 170 200 180 L 230 230 L 256 180 L 282 230 
           L 310 180 Q 330 170 340 190 L 340 250" 
        fill="none" stroke="url(#goldGradient)" stroke-width="6" 
        stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Text MARICO -->
  <text x="256" y="350" font-family="serif" font-size="48" font-weight="300" 
        fill="url(#goldGradient)" text-anchor="middle" letter-spacing="8">MARICO</text>
  
  <!-- Text EVENT -->
  <text x="256" y="390" font-family="serif" font-size="20" font-weight="300" 
        fill="url(#goldGradient)" text-anchor="middle" letter-spacing="12">EVENT</text>
  
  <!-- Decorative lines -->
  <line x1="140" y1="370" x2="220" y2="370" stroke="url(#goldGradient)" stroke-width="1"/>
  <line x1="292" y1="370" x2="372" y2="370" stroke="url(#goldGradient)" stroke-width="1"/>
</svg>
